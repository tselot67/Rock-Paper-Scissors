<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title> Rock, Paper Scissors </title>
        <link href="./styles/index.css" rel="stylesheet"/>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"/>
    </head>
    <body>
        <section id="flex-r">
            <h2> <i class="fa-regular fa-hand"></i>  
                <span class="rock-title">ROCK</span>
                <span class="paper-title">PAPER</span>
                <span class="scissor-title">SCISSORS</span>
            </h2>
        </section>
        <div id="whole">
            <div id="flex-c">
                <div id="circle">
                    <p> Rounds </p>
                    <p> 1/5 </p>
                </div>
                <div id="circles">
                    <div> 1</div>
                    <div> 2</div>
                    <div> 3</div>
                    <div> 4</div>
                    <div> 5</div>
                </div>
                <hr>
                <div id="selects"> 
                    <p id="select"> SELECT ROUNDS</p>
                    <button id="fifth" class="sel"> 5 ROUNDS</button>
                    <button id="seventh" class="sel"> 7 ROUNDS</button>
                </div>
            </div>
        <div id="main">
        <div id="title">
        <h1> Choose your weapon!</h1>
        <p> Rock &nbsp;Paper&nbsp; Scissors </p>
        </div>
        <div id="vs">
            <div class="scores">
                <i class="fa-solid fa-user"></i>
                <p>You</p>
                <p id="score-you"> 0 </p>
            </div>
            <div id="trophy">
                <hr><i class="fa-solid fa-trophy"></i><hr>
            </div>
            <div class="scores">
                <i class="fa-solid fa-robot"></i>
                <p>Computer</p>
                <p id="score-comp"> 0 </p>
            </div>
        </div>
        <div id="counters">
            <div id="your" class="count">
                <i class="fa-solid fa-circle-question"></i>
                <h2> YOU</h2>
            </div>
            <div class="bolt">
                <p> <i class="fa-solid fa-bolt"></i> VS <i class="fa-solid fa-bolt"></i></p>
            </div>
            <div id="computer" class="count">
                <i class="fa-solid fa-microchip"></i>
                <h2> COMPUTER </h2>
            </div>
        </div>
        <div id="win-score">

        </div>
        <div id="choices">
            <div class="choice">
              <button class="rock-btn"><i class="fa-solid fa-hand-fist"></i>
              <p> Rock</p>  </button>
            </div>
            <div class="choice">
              <button class="paper-btn"><i class="fa-solid fa-hand"></i>
              <p> Paper</p> </button> 
            </div>
            <div class="choice">
              <button class="scissor-btn"><i class="fa-solid fa-hand-peace"></i>
              <p> Scissor</p> </button> 
            </div>
        </div>
        <div id="restart">
            <button id="restart-btn"><i class="fa-solid fa-arrows-rotate"></i> RESTART GAME </button>
        </div>
        </div>
        </div>
        <div id="game-dark"></div>
        <div id="game-over">
            <h2> GAME OVER</h2>
            <p id="final-result"></p>
            <p id="final-score"></p>
            <button id="play-again"> PLAY AGAIN</button>
        </div>
    </body>
</html>
